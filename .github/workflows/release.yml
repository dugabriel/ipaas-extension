name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package extension
        run: cd dist && zip -r "../ipaas-helper-${GITHUB_REF_NAME}.zip" . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ipaas-helper-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            Extensão iPaaS Helper — ${{ github.ref_name }}

            ## Como instalar
            1. Baixe o arquivo `ipaas-helper-${{ github.ref_name }}.zip` abaixo e extraia.
            2. Abra `chrome://extensions` e ative o **Modo do desenvolvedor**.
            3. Clique em **Carregar sem compactação** e selecione a pasta extraída.
